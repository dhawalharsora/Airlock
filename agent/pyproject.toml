[project]
name = "airlock-agent"
version = "0.1.0"
description = "Airlock agent loop (Strands) + provider interface"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.0.0",
    "mcp>=1.6.0",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
ollama = ["strands-agents[ollama]>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock_agent"]
